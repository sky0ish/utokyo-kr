<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>글쓰기 | 재한 도쿄대학 총동문회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/OB/board/board.css?v=107">
</head>
<body>


<div class="topbar">
  <div class="inner">
    <div class="links">
      <a href="/index.html">⌂ 통합 홈</a>
      <a href="https://www.u-tokyo.ac.jp/en/" target="_blank" rel="noopener">도쿄대학 홈페이지</a>
      <a href="/YB/index.html">한국인학생회</a>
      <a href="https://alumni.tokyoksa.com/" target="_blank" rel="noopener">총동문회 홈페이지(기존)</a>

    </div>
    <div class="links" id="authLinks"><a href="/OB/auth/login.html">로그인</a><a href="/OB/auth/signup.html">회원가입</a><a href="/OB/auth/find.html">아이디·비번 찾기</a></div>
  </div>
</div>

<header class="mhead">
  <div class="inner">
    <a class="mlogo" href="/OB/index.html">재한 도쿄대학 총동문회<small>在韓東京大学総同門会 · EST. 2011</small></a>
    <nav></nav>
    <div class="mpills"></div>
  </div>
</header>

<div class="banner">
  <div class="binner">
    <span class="en">Write</span>
    <h1 id="pageTitle">글쓰기</h1>
  </div>
</div>

<div class="wrap">

  <div class="form">
    <div class="msg" id="topMsg"></div>
    <form id="postForm" style="display:none;">
      <label>제목 *</label>
      <input type="text" id="title" required maxlength="200">

      <label>작성자 구분 *</label>
      <div class="tabs" id="orgTabs" style="margin-bottom:2px;">
        <a href="#" data-org="OB" class="on">OB — 총동문회</a>
        <a href="#" data-org="YB">YB — 학생회</a>
      </div>

      <label>게시판 분류 *</label>
      <div class="pickrow" id="catPick">
        <a href="#" data-v="free">자유게시판</a>
        <a href="#" data-v="club">소모임</a>
        <a href="#" data-v="mentoring">멘토멘티</a>
        <a href="#" data-v="promo">홍보·채용</a>
        <a href="#" data-v="condolence">경조사</a>
        <a href="#" data-v="notice">공지사항</a>
      </div>

      <label>말머리 * <span style="font-weight:300;color:#9a947f;">(제목 앞에 [말머리]로 붙습니다)</span></label>
      <div class="pickrow" id="tagPick"></div>
      <div class="whatfor" id="whatFor"></div>

      <div style="margin-top:16px;">
        <label>공개 범위</label>
        <input id="visInfo" value="회원 전용" disabled style="background:#f2efe8;color:#8a8574;">
      </div>

      <label>내용 *</label>
      <textarea id="content" required></textarea>

      <label>파일 첨부 <span style="font-weight:300;color:#9a947f;">(한 개당 25MB 까지 · 여러 개 고를 수 있습니다)</span></label>
      <div class="fdrop" id="fdrop">
        <input type="file" id="files" multiple style="display:none;">
        <b>파일을 여기에 끌어다 놓으세요</b>
        <span>또는 눌러서 고르기 — 문서 · 사진 · 압축파일 무엇이든</span>
        <span>화면을 캡처하셨다면 Ctrl+V 로 바로 붙여넣으셔도 됩니다</span>
      </div>
      <div class="flist" id="flist"></div>

      <button class="btn dark" id="submitBtn" type="submit" style="margin-top:20px;">등록하기</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script type="module">
import { initWrite } from "/OB/board/write-core.js?v=107";
initWrite("OB");
</script>

</body>
</html>
