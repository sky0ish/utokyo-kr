<!DOCTYPE html>

<head>

<title>캠퍼스 지도 | 재한 도쿄대학 총동문회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/board/board.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<link rel="stylesheet" href="/common/map.css?v=33">
<style>
  :root{ --map-accent:#8a6d2b; --map-line:#e6dfcb; --map-soft:#fdf1d3; --map-tip:#faf7ef; }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .topbar .inner,.mhead .inner,.banner .binner{max-width:1180px;padding-left:24px;padding-right:24px;}
  /* 사진 아래 — 왼쪽 스카이라인 · 오른쪽 끝까지 한 줄 · TOKYO */
  .skystrip{background:#fff;border-bottom:1px solid #ece5d6;}
  .ssinner{max-width:1180px;margin:0 auto;padding:16px 24px 0;
    display:flex;align-items:flex-end;gap:16px;color:#33373e;}
  .ssky{flex:none;height:58px;width:auto;display:block;}
  .ssline{flex:1;height:3px;background:currentColor;margin-bottom:0;border-radius:2px;}
  .ssword{flex:none;font-family:Georgia,serif;font-size:22px;font-weight:700;
    letter-spacing:.30em;line-height:1;padding-bottom:2px;}
  @media (max-width:680px){
    .ssinner{padding:12px 16px 0;gap:10px;}
    .ssky{height:40px;} .ssword{font-size:15px;letter-spacing:.22em;} .ssline{height:2px;}
  }
  .mapnote{margin:26px 0 22px;font-size:14.5px;color:#5c563f;line-height:1.85;word-break:keep-all;}
  .mapnote b{color:#8a6d2b;font-weight:600;}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="links">

  <div class="binner">
    <span class="en">Campus Map</span>
    <h1>도쿄 지도</h1>
  </div>
</div>

<div class="skystrip">
  <div class="ssinner">

          <rect x="108" y="58" width="26" height="62"/>
          <rect x="140" y="80" width="20" height="40"/>
          <!-- 도쿄타워 -->
          <path d="M182 120 L194 48 L198 48 L210 120 Z"/>
          <path d="M190 42 h12 v6 h-12 z"/>
          <rect x="194" y="20" width="4" height="22"/>
          <rect x="184" y="74" width="24" height="4"/>
          <rect x="180" y="96" width="32" height="4"/>
          <rect x="222" y="76" width="26" height="44"/>
          <rect x="254" y="60" width="22" height="60"/>

          <rect x="322" y="72" width="24" height="48"/>

          <path d="M368 120 L377 26 L382 26 L391 120 Z"/>
          <ellipse cx="379.5" cy="38" rx="13" ry="6"/>
          <ellipse cx="379.5" cy="18" rx="9" ry="4"/>
          <rect x="377.5" y="0" width="4" height="18"/>
          <rect x="402" y="84" width="28" height="36"/>
          <rect x="436" y="64" width="22" height="56"/>
          <rect x="464" y="92" width="40" height="28"/>
          <rect x="510" y="76" width="24" height="44"/>
          <rect x="540" y="98" width="20" height="22"/>
        </g>
      </svg>
      <span class="ssline"></span>
      <span class="ssword">T O K Y O</span>
  </div>
</div>

<div class="wrap">
  <div class="mapnote">
    도쿄대학 캠퍼스와 동문·재학생이 나눈 <b>맛집 · 까페 · 추억의 장소 · 건축물</b>을 지도에 모았습니다.
    표시를 누르면 그 장소 안내가 열립니다. 회원이라면 아래에서 <b>주소만 적어</b> 새 장소를 올리실 수 있습니다.
  </div>
  <div id="mapapp"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
