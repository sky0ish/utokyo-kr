<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="/board/board.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<link rel="stylesheet" href="/common/map.css?v=51">
<style>
  :root{ --map-accent:#8a6d2b; --map-line:#e6dfcb; --map-soft:#fdf1d3; --map-tip:#faf7ef; }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .topbar .inner,.mhead .inner,.banner .binner{max-width:1180px;padding-left:24px;padding-right:24px;}
  /* 배너 — 노을 하늘 (푸른 하늘에 분홍 구름결, 지평선 가까이 주황빛) */
  .banner{position:relative;overflow:hidden;padding-bottom:0;
    background:
      radial-gradient(58% 11px at 28% 30%, rgba(255,168,150,.50), transparent 72%),
      radial-gradient(42% 8px  at 55% 24%, rgba(255,150,138,.42), transparent 72%),
      radial-gradient(48% 9px  at 74% 36%, rgba(255,178,152,.45), transparent 72%),
      radial-gradient(38% 7px  at 18% 44%, rgba(255,190,165,.42), transparent 72%),
      radial-gradient(52% 10px at 62% 47%, rgba(255,172,140,.40), transparent 72%),
      radial-gradient(34% 6px  at 40% 55%, rgba(255,196,168,.38), transparent 74%),
      linear-gradient(180deg,#10254a 0%,#1a3a68 15%,#28578c 30%,#3f78a8 44%,#6f9bbd 56%,#a99ba8 66%,#d8a184 76%,#eda368 85%,#f7c88c 93%,#fce2b6 100%);}
  /* 지평선 가까이 지는 해 */
  .banner::before{content:"";position:absolute;left:66%;bottom:52px;width:210px;height:120px;
    transform:translateX(-50%);z-index:1;
    background:radial-gradient(ellipse at center,rgba(255,238,198,.95) 0%,rgba(255,182,110,.40) 32%,transparent 70%);}
  .banner .binner{position:relative;z-index:3;max-width:1180px;margin:0 auto;
    padding:26px 24px 0;}
  .banner .en{font-family:Georgia,serif;font-style:italic;font-size:13px;letter-spacing:.14em;
    color:#ffdcae;display:block;margin-bottom:3px;text-shadow:0 1px 10px rgba(0,0,0,.5);}
  .banner h1{font-family:'Noto Serif KR',serif;font-size:27px;font-weight:600;
    color:#fdf6ea;text-shadow:0 2px 16px rgba(0,0,0,.55);margin:0;}
  /* 아래줄 : 왼쪽 스카이라인 — 선 — 오른쪽 TOKYO */
  .skyrow{position:relative;z-index:3;max-width:1180px;margin:0 auto;
    padding:0 24px 16px;display:flex;align-items:flex-end;gap:16px;color:#0e1526;
    margin-top:-8px;}
  .ssky{flex:none;height:70px;width:auto;display:block;
    filter:drop-shadow(0 -1px 2px rgba(0,0,0,.22));}
  .ssline{flex:1;height:3px;background:currentColor;border-radius:2px;margin-bottom:1px;}
  .ssword{flex:none;font-family:Georgia,serif;font-size:22px;font-weight:700;
    letter-spacing:.32em;line-height:1;padding-bottom:1px;}
  @media (max-width:680px){
    .banner::before{left:62%;bottom:58px;width:130px;height:130px;}
    .banner::after{bottom:60px;height:44px;}
    .banner .binner{padding:20px 16px 0;}
    .banner h1{font-size:21px;}
    .skyrow{padding:0 16px 12px;gap:10px;margin-top:-4px;}
    .ssky{height:46px;} .ssword{font-size:15px;letter-spacing:.24em;} .ssline{height:2px;}
  }
  .mapnote{margin:22px 0 18px;padding:15px 20px;background:#fff;
    border:1px solid #e6dfcb;border-radius:11px;
    font-size:14.5px;color:#4a463a;line-height:1.7;word-break:keep-all;}
  .mapnote b{color:#2f2a1d;font-weight:600;}
</style>
<script>

          location.replace(location.pathname + "?r=" + v.map);

      }).catch(function () {});
  })();
</script>
</head>
