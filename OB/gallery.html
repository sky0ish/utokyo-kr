<style>
  /* 상단바·메뉴·배너를 사진 열과 같은 폭으로 (기본 960px → 1180px) */
  .topbar .inner,.mhead .inner,.banner .binner{max-width:1180px;padding-left:24px;padding-right:24px;}
  .gwrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .gtabs{display:flex;flex-wrap:wrap;gap:9px;margin:34px 0 8px;}
  .gtabs a{padding:11px 24px;border-radius:9px;font-size:15px;font-weight:500;color:#5c563f;
    background:linear-gradient(#fffdf7,#f4efe1);border:1px solid #e0d7bf;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(90,70,20,.14), 0 6px 14px rgba(90,70,20,.12);
    transition:.18s;}
  .gtabs a:hover{transform:translateY(-2px);color:#3f3a29;}
  .gtabs a.on{color:#4a3c14;background:linear-gradient(#fdf1d3,#f0dfb2);border-color:#d3bd85;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(90,70,20,.2);transform:translateY(1px);}
  .gcount{font-size:13px;color:#a8a291;margin:14px 0 20px;}

  /* 앨범 목록 */
  .ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .alb{cursor:pointer;display:block;transition:.22s;}
  .alb .sq{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:#f3f0e8;
    border:1px solid #e8e2d2;box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 6px rgba(60,50,20,.09);transition:.22s;}
  .alb .sq img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s;}
  .alb .n{position:absolute;right:9px;bottom:9px;background:rgba(20,24,34,.78);color:#fff;
    font-size:11.5px;padding:4px 10px;border-radius:100px;backdrop-filter:blur(6px);}
  .alb:hover{transform:translateY(-4px);}
  .alb:hover .sq{border-color:var(--gold,#c9a961);box-shadow:0 10px 24px rgba(60,50,20,.2);}
  .alb:hover .sq img{transform:scale(1.05);}
  .alb .cp{padding:11px 2px 0;}
  .alb .cp b{display:block;font-size:13.5px;font-weight:500;color:#3d4453;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .alb .cp small{display:block;margin-top:4px;font-size:11.5px;color:#a09a86;}
  .gempty{padding:70px 0;text-align:center;color:#a8a291;}
  @media (max-width:980px){ .ggrid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .ggrid{grid-template-columns:repeat(2,1fr);gap:12px;} .gtabs a{font-size:13.5px;padding:9px 16px;} }
</style>

<script src="gallery-data.js?v=3"></script>
<script type="module">
import { sb, currentUser, myProfile } from "../auth/auth.js";

const CATS = [
  ["assembly", "총회"],
  ["club",     "소모임"],
  ["faculty",  "단과대모임"],
  ["forum",    "포럼·세미나"],
  ["old",      "옛날사진"],
  ["daily",    "일상"],
  ["etc",      "기타"],
];
const G = window.GALLERY || {};
const BASE = "../images/gallery/";

let cur = new URLSearchParams(location.search).get("cat") || "assembly";
if (!CATS.some(c => c[0] === cur)) cur = "assembly";

document.getElementById("gtabs").innerHTML = CATS.map(([k, v]) =>
  `<a href="?cat=${k}" data-c="${k}">${v} <span style="opacity:.5;font-size:12px;">${(G[k]||[]).length}</span></a>`).join("");

function render() {
  document.querySelectorAll("#gtabs a").forEach(a => a.classList.toggle("on", a.dataset.c === cur));
  const list = G[cur] || [];
  const name = (CATS.find(c => c[0] === cur) || [, ""])[1];
  const shots = list.reduce((s, a) => s + a.p.length, 0);
  document.getElementById("gcount").textContent = `${name} · 앨범 ${list.length}개 · 사진 ${shots}장 (최신순)`;
  const grid = document.getElementById("ggrid");
  if (!list.length) { grid.innerHTML = '<div class="gempty">등록된 사진이 없습니다.</div>'; return; }
  grid.innerHTML = list.map(a => `
    <a class="alb" href="album.html?cat=${cur}&id=${a.i}" target="_blank" rel="noopener">
      <span class="sq">
        <img src="${BASE}${cur}/${a.p[0]}_t.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="n">${a.p.length}장</span>
      </span>
      <span class="cp"><b>${a.t}</b><small>${a.d}</small></span>
    </a>`).join("");
}

document.querySelectorAll("#gtabs a").forEach(a => a.addEventListener("click", (e) => {
  e.preventDefault();
  cur = a.dataset.c;
  history.replaceState(null, "", "?cat=" + cur);
  render();
}));
render();

// 상단바 로그인 표시 (갤러리 렌더 뒤에)
try {
  const user = await currentUser();
  if (user) {
    const p = await myProfile();
    const el = document.getElementById("authLinks");
    el.innerHTML = "";
    const st = document.createElement("span");
    st.textContent = "[로그인중]"; st.style.color = "#7fc48a"; st.style.fontWeight = "700";
    const my = document.createElement("a");
    my.href = "../auth/mypage.html";
    my.textContent = (p && p.name) ? p.name + "님" : "내 정보";
    const out = document.createElement("a");
    out.href = "#"; out.textContent = "로그아웃";
    out.addEventListener("click", async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); });
    el.append(st, my, out);
  }
} catch (e) { /* 무시 */ }
</script>
