<style>
  /* 상단바·메뉴·배너를 사진 열과 같은 폭으로 (기본 960px → 1180px) */
  .topbar .inner,.mhead .inner,.banner .binner{max-width:1180px;padding-left:24px;padding-right:24px;}
  .gwrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .gtabs{display:flex;flex-wrap:wrap;gap:9px;margin:34px 0 8px;}
  .gtabs a{padding:11px 24px;border-radius:9px;font-size:15px;font-weight:500;color:#5c563f;
    background:linear-gradient(#fffdf7,#f4efe1);border:1px solid #e0d7bf;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(90,70,20,.14), 0 6px 14px rgba(90,70,20,.12);
    transition:.18s;}
  .gtabs a:hover{transform:translateY(-2px);color:#3f3a29;}
  .gtabs a.on{color:#4a3c14;background:linear-gradient(#fdf1d3,#f0dfb2);border-color:#d3bd85;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(90,70,20,.2);transform:translateY(1px);}
  .gcount{font-size:13px;color:#a8a291;margin:14px 0 20px;}
  .gbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px 0 20px;}
  .newalb{display:none;padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;
    font-family:inherit;border:1px solid #ddcb9e;background:linear-gradient(#fdf6e6,#f2e6c9);color:#4a3c14;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(90,70,20,.16);transition:.2s;}
  .newalb.on{display:inline-block;}
  .newalb:hover{transform:translateY(-2px);}
  .alb .mine{position:absolute;top:8px;left:8px;background:rgba(47,122,69,.88);color:#fff;
    border-radius:100px;padding:3px 10px;font-size:10.5px;}

  /* 사진첩 만들기 */
  .modal{position:fixed;inset:0;background:rgba(10,14,22,.6);display:none;z-index:800;
    align-items:center;justify-content:center;padding:24px;}
  .modal.on{display:flex;}
  .modal .box{background:#fff;border-radius:12px;padding:26px;max-width:480px;width:100%;
    max-height:88vh;overflow:auto;}
  .modal h3{font-family:'Noto Serif KR',serif;font-size:19px;margin-bottom:4px;}
  .modal .sub{font-size:12.5px;color:#9a947f;margin-bottom:6px;line-height:1.6;}
  .modal label{display:block;font-size:12.5px;font-weight:500;color:#5c563f;margin:14px 0 6px;}
  .modal input,.modal select{width:100%;padding:10px 12px;border:1px solid #ddd6c4;border-radius:7px;
    font-family:inherit;font-size:14px;background:#fffdf8;color:#2f2a1d;}
  .modal .foot{margin-top:22px;display:flex;gap:8px;justify-content:flex-end;}
  .modal .btn{padding:10px 22px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;
    font-family:inherit;border:1px solid #ddcb9e;background:linear-gradient(#fdf6e6,#f2e6c9);color:#4a3c14;}
  .modal .btn.dark{background:#22283a;border-color:#22283a;color:#fff;}
  .modal .btn:disabled{opacity:.5;cursor:default;}
  .modal .msg{margin-top:12px;font-size:13px;color:#7d7768;}
  .modal .msg.err{color:#b3453b;} .modal .msg.ok{color:#2f7a45;}

  /* 앨범 목록 */
  .ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .alb{cursor:pointer;display:block;border-radius:10px;overflow:hidden;background:#fff;
    border:1px solid #e8e2d2;box-shadow:0 2px 6px rgba(60,50,20,.07);transition:.22s;}
  .alb:hover{transform:translateY(-3px);border-color:var(--gold,#c9a961);box-shadow:0 8px 20px rgba(60,50,20,.16);}
  .alb .sq{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:#f3f0e8;}
  .alb .sq img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s;}
  .alb:hover .sq img{transform:scale(1.05);}
  .alb .cp{display:block;padding:12px 13px 14px;}
  .alb .cp b{display:-webkit-box;font-size:13.5px;font-weight:500;color:#332e22;line-height:1.5;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .alb .cp small{display:block;margin-top:5px;font-size:11.5px;color:#a09a86;}
  .gempty{padding:70px 0;text-align:center;color:#a8a291;}
  @media (max-width:980px){ .ggrid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .ggrid{grid-template-columns:repeat(2,1fr);gap:12px;} .gtabs a{font-size:13.5px;padding:9px 16px;} }
</style>

<!-- 사진첩 만들기 -->
<div class="modal" id="mNew">
  <div class="box">
    <h3>사진첩 만들기</h3>
    <div class="sub">사진첩을 만들면 회원 누구나 그 안에 사진을 더 올릴 수 있습니다.</div>
    <label>분류 *</label>
    <select id="nCat"></select>
    <label>사진첩 이름 *</label>
    <input type="text" id="nTitle" maxlength="60" placeholder="예: 2026년 봄 등산 모임">
    <label>행사 날짜 *</label>
    <input type="date" id="nDate">
    <label>사진 <span style="font-weight:300;color:#9a947f;">(지금 올리지 않고 나중에 추가해도 됩니다)</span></label>
    <input type="file" id="nFiles" accept="image/*" multiple>
    <div class="foot">
      <button class="btn" id="nCancel">취소</button>
      <button class="btn dark" id="nSave">만들기</button>
    </div>
    <div class="msg" id="nMsg"></div>
  </div>

<script src="gallery-data.js?v=14"></script>
<script type="module">
import { sb, currentUser, myProfile } from "../auth/auth.js";
import { CATS, CAT_NAME, loadGallery } from "./gallery-lib.js?v=14";

let cur = new URLSearchParams(location.search).get("cat") || "assembly";
if (!CATS.some(c => c[0] === cur)) cur = "assembly";

const { byCat } = await loadGallery();

document.getElementById("gtabs").innerHTML = CATS.map(([k, v]) =>
  `<a href="?cat=${k}" data-c="${k}">${v} <span style="opacity:.5;font-size:12px;">${(byCat[k]||[]).length}</span></a>`).join("");

function render() {
  document.querySelectorAll("#gtabs a").forEach(a => a.classList.toggle("on", a.dataset.c === cur));
  const list = byCat[cur] || [];
  const shots = list.reduce((s, a) => s + a.photos.length, 0);
  document.getElementById("gcount").textContent =
    `${CAT_NAME[cur]} · 앨범 ${list.length}개 · 사진 ${shots}장 (최신순)`;
  const grid = document.getElementById("ggrid");
  if (!list.length) { grid.innerHTML = '<div class="gempty">등록된 사진이 없습니다.</div>'; return; }
  grid.innerHTML = list.map(a => `
    <a class="alb" href="album.html?cat=${a.cat}&id=${encodeURIComponent(a.key)}" target="_blank" rel="noopener">
      <span class="sq">
        ${a.custom ? '<span class="mine">회원 사진첩</span>' : ""}
        ${a.photos.length
          ? `<img src="${a.photos[0].thumb}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
          : '<span style="display:flex;align-items:center;justify-content:center;height:100%;color:#b7b09b;font-size:13px;">사진을 올려주세요</span>'}
      </span>
      <span class="cp"><b>${a.title}</b><small>${(a.date || "").replace(/-/g, ".")} · 사진 ${a.photos.length}장</small></span>
    </a>`).join("");
}

document.querySelectorAll("#gtabs a").forEach(a => a.addEventListener("click", (e) => {
  e.preventDefault();
  cur = a.dataset.c;
  history.replaceState(null, "", "?cat=" + cur);
  render();
}));
render();

// ─── 로그인 상태 · 사진첩 만들기 ───
try {
  const user = await currentUser();
  if (user) {
    const p = await myProfile();

    // 승인된 회원이면 사진첩 만들기 사용 가능
    if (p && (p.approved || p.is_admin)) setupNewAlbum(user);

    if (p && p.is_admin) {                     // 운영진에게만 관리 버튼
      const ad = document.createElement("a");
      ad.href = "../admin/gallery.html";
      ad.textContent = "⚙ 갤러리 관리";
      ad.style.color = "#e8c876";
      const mb = document.createElement("a");
      mb.href = "../admin/members.html";
      mb.textContent = "⚙ 회원 관리";
      mb.style.color = "#e8c876";
      document.querySelector(".topbar .links").append(ad, mb);
    }
    const el = document.getElementById("authLinks");
    el.innerHTML = "";
    const st = document.createElement("span");
    st.textContent = "[로그인중]"; st.style.color = "#7fc48a"; st.style.fontWeight = "700";
    const my = document.createElement("a");
    my.href = "../auth/mypage.html";
    my.textContent = (p && p.name) ? p.name + "님" : "내 정보";
    const out = document.createElement("a");
    out.href = "#"; out.textContent = "로그아웃";
    out.addEventListener("click", async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); });
    el.append(st, my, out);
  }
} catch (e) { /* 무시 */ }

// ─── 사진첩 만들기 (승인 회원 전용) ───
function setupNewAlbum(user) {
  const modal = document.getElementById("mNew");
  document.getElementById("nCat").innerHTML =
    CATS.map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  const btn = document.getElementById("newAlb");
  btn.classList.add("on");
  btn.addEventListener("click", () => {
    document.getElementById("nCat").value = cur;
    document.getElementById("nDate").value = new Date().toISOString().slice(0, 10);
    document.getElementById("nMsg").textContent = "";
    modal.classList.add("on");
  });
  document.getElementById("nCancel").addEventListener("click", () => modal.classList.remove("on"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("on"); });

  document.getElementById("nSave").addEventListener("click", async () => {
    const save = document.getElementById("nSave");
    const msg = document.getElementById("nMsg");
    const cat = document.getElementById("nCat").value;
    const title = document.getElementById("nTitle").value.trim();
    const date = document.getElementById("nDate").value;
    const files = [...document.getElementById("nFiles").files];
    if (!title) { msg.className = "msg err"; msg.textContent = "사진첩 이름을 입력해주세요."; return; }
    if (!date) { msg.className = "msg err"; msg.textContent = "행사 날짜를 입력해주세요."; return; }

    save.disabled = true;
    msg.className = "msg"; msg.textContent = "사진첩을 만드는 중…";
    const key = "custom:" + (crypto.randomUUID ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    const { error } = await sb.from("gallery_albums").insert({
      album_key: key, title, category: cat, event_date: date, org: "OB",
      created_by: user.id, updated_by: user.id,
    });
    if (error) {
      save.disabled = false; msg.className = "msg err";
      msg.textContent = "만들기 실패: " + error.message +
        " — 운영진 승인이 완료된 회원만 사진첩을 만들 수 있습니다.";
      return;
    }
    let ok = 0, fail = 0, last = "";
    for (const [n, f] of files.entries()) {
      msg.textContent = `사진 올리는 중… (${n + 1}/${files.length})`;
      const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = `${cat}/${date}_${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const up = await sb.storage.from("gallery").upload(path, f, { cacheControl: "3600" });
      if (up.error) { fail++; last = up.error.message; continue; }
      const { data: pub } = sb.storage.from("gallery").getPublicUrl(path);
      const ins = await sb.from("gallery_photos").insert({
        category: cat, taken_at: date, album_key: key, sort: n, org: "OB",
        image_url: pub.publicUrl, storage_path: path, created_by: user.id,
      });
      if (ins.error) { fail++; last = ins.error.message; } else ok++;
    }
    msg.className = "msg " + (fail ? "err" : "ok");
    msg.textContent = `사진첩을 만들었습니다 — 사진 ${ok}장` + (fail ? ` · 실패 ${fail}장 (${last})` : "");
    setTimeout(() => { location.href = "album.html?cat=" + cat + "&id=" + encodeURIComponent(key); }, 800);
  });
}
</script>
