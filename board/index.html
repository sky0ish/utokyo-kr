<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>이동 중…</title>
</head>
<body>
<p style="font-family:'Malgun Gothic',sans-serif;padding:40px;color:#5c563f;">
  게시판이 단체별 폴더로 나뉘었습니다. 잠시 후 새 주소로 이동합니다…
</p>
<script>
  // 예전 주소(board/index.html)로 들어와도 그 단체의 새 화면으로 보냅니다.
  var q = new URLSearchParams(location.search);
  var org = (q.get("org") || "").toUpperCase() === "YB" ? "YB" : "OB";
  q.delete("org");
  var rest = q.toString();
  location.replace("/" + org + "/board.html" + (rest ? "?" + rest : ""));
</script>
</body>
</html>
