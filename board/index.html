<div class="banner">
  <div class="binner">
    <span class="en">Community Board</span>

<div class="wrap">
  <div class="head" style="justify-content:flex-end;">

      <a class="btn line" href="https://www.facebook.com/groups/286637871392457" target="_blank" rel="noopener">페이스북 그룹</a>

    </div>
  </div>

  <div class="tabs" id="catTabs">
    <a href="#" data-cat="">전체</a>
    <a href="#" data-cat="free">자유게시판</a>
    <a href="#" data-cat="club">소모임</a>

    <a href="#" data-cat="promo">홍보</a>

  </div>

  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>

  <div class="notice-box" id="loginNotice" style="display:none;">
    회원 전용 글은 로그인 후 보입니다. 승인된 회원만 글을 쓸 수 있습니다.
    <a href="../auth/login.html">로그인</a> · <a href="../auth/signup.html">회원가입</a>
  </div>
</div>

<script type="module">
import { sb, currentUser, myProfile } from "../auth/auth.js";

const CAT = { notice:"공지", free:"자유", club:"소모임", jobs:"구인", mentoring:"멘티멘토", promo:"홍보", condolence:"경조사", faculty:"단과대별", news:"소식", market:"장터" };
const SRC = {
  band: '<span class="src-tag band">네이버밴드</span>',
  facebook: '<span class="src-tag fb">페이스북</span>',
  legacy: '<span class="src-tag legacy">(구)게시판</span>'
};
const params = new URLSearchParams(location.search);
const org = params.get("org") || "";
let cat = params.get("cat") || "";
if (!CAT[cat]) cat = "";

document.querySelectorAll("#catTabs a").forEach(a => {
  a.addEventListener("click", (e) => {
    e.preventDefault();
    cat = a.dataset.cat || "";
    document.querySelectorAll("#catTabs a").forEach(x => x.classList.remove("on"));
    a.classList.add("on");
    load();
  });
});
(document.querySelector('#catTabs a[data-cat="' + cat + '"]') || document.querySelector('#catTabs a[data-cat=""]')).classList.add("on");

// 로그인 상태 표시
const user = await currentUser();
if (user) {
  const p = await myProfile();
  document.getElementById("authLinks").innerHTML =
    `<a href="../auth/mypage.html">${(p && p.name) ? p.name + "님" : "내 정보"}</a>`;
} else {
  document.getElementById("loginNotice").style.display = "block";
}

document.getElementById("writeBtn").addEventListener("click", async () => {
  if (!user) { location.href = "../auth/login.html"; return; }
  location.href = "write.html" + (org ? "?org=" + org : "");
});

async function load() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  let q = sb.from("posts")
    .select("id,title,org,category,author_name,visibility,source,created_at")
    .order("created_at", { ascending: false })
    .limit(100);
  if (cat) q = q.eq("category", cat);
  const { data, error } = await q;
  if (error) { listEl.innerHTML = '<div class="empty">게시판을 불러오지 못했습니다. (' + error.message + ')</div>'; return; }
  if (!data || data.length === 0) { listEl.innerHTML = '<div class="empty">아직 게시글이 없습니다.</div>'; return; }
  listEl.innerHTML = data.map(p => `
    <a class="row" href="post.html?id=${p.id}">
      <span class="chip ${p.category}">${CAT[p.category] || p.category}</span>
      <span class="t">${escapeHtml(p.title)}${SRC[p.source] || ""}${p.visibility === "members" ? '<span class="lock">회원전용</span>' : ""}</span>
      <span class="meta">${escapeHtml(p.author_name || "")} <span class="chip org-${p.org}">${p.org === "ALL" ? "공통" : p.org}</span><br>${p.created_at.slice(0,10)}</span>
    </a>`).join("");
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>

</body>
