<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 | 도쿄대학교 한국 커뮤니티</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="links">
      <a href="javascript:history.back()">← 이전화면으로</a>
      <a href="../index.html">⌂ 통합 홈</a>
      <a href="index.html">게시판 목록</a>
    </div>
    <div class="links"><a href="../auth/mypage.html">내 정보</a></div>
  </div>
</div>

<header class="mhead">
  <div class="inner">
    <a class="mlogo" href="../OB/index.html">재한 도쿄대학 총동문회<small>在韓東京大学総同門会 · EST. 2011</small></a>
    <nav>
      <a href="../OB/index.html#greeting">동문회 소개</a>
      <a href="index.html">게시판</a>
      <a href="../OB/index.html#join">참여마당</a>
      <a href="../OB/index.html#gallery">갤러리</a>
      <a href="../OB/index.html#sponsor">후원</a>
    </nav>
    <div class="mpills">
      <a class="band" href="https://www.band.us/band/58105635/post" target="_blank" rel="noopener">네이버 밴드 →</a>
      <a class="fb" href="https://www.facebook.com/groups/286637871392457" target="_blank" rel="noopener">페이스북 그룹</a>
    </div>
  </div>
</header>

<div class="banner">
  <div class="binner">
    <span class="en">Write</span>
    <h1 id="pageTitle">글쓰기</h1>
  </div>
</div>

<div class="wrap">

  <div class="form">
    <div class="msg" id="topMsg"></div>
    <form id="postForm" style="display:none;">
      <label>제목 *</label>
      <input type="text" id="title" required maxlength="200">

      <label>작성자 구분 *</label>
      <div class="tabs" id="orgTabs" style="margin-bottom:2px;">
        <a href="#" data-org="OB" class="on">OB — 총동문회</a>
        <a href="#" data-org="YB">YB — 학생회</a>
      </div>

      <div class="row3" style="grid-template-columns:1fr 1fr;">
        <div>
          <label>분류 *</label>
          <select id="category">
            <option value="free">자유게시판</option>
            <option value="club">소모임</option>
            <option value="mentoring">멘티멘토</option>
            <option value="condolence">경조사</option>
            <option value="notice">공지사항</option>
          </select>
        </div>
        <div>
          <label>공개 범위</label>
          <input value="회원 전용" disabled style="background:#f2efe8;color:#8a8574;">
        </div>
      </div>

      <label>내용 *</label>
      <textarea id="content" required></textarea>

      <button class="btn dark" id="submitBtn" type="submit" style="margin-top:20px;">등록하기</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script type="module">
import { sb, currentUser, myProfile } from "../auth/auth.js";

const topMsg = document.getElementById("topMsg");
const form = document.getElementById("postForm");
const editId = new URLSearchParams(location.search).get("edit");
const preOrg = new URLSearchParams(location.search).get("org");

const user = await currentUser();
if (!user) { location.href = "../auth/login.html"; }
const profile = await myProfile();

if (!profile || !profile.approved) {
  topMsg.className = "msg err";
  topMsg.textContent = "글쓰기는 운영진 승인이 완료된 회원만 가능합니다. (현재: 승인 대기중)";
} else {
  form.style.display = "block";

  // OB/YB 탭 — 회원 프로필의 소속이 기본 선택
  let org = (preOrg === "YB" || preOrg === "OB") ? preOrg
          : (profile.member_type === "YB" ? "YB" : "OB");
  const orgTabs = document.querySelectorAll("#orgTabs a");
  function setOrg(v) {
    org = v;
    orgTabs.forEach(a => a.classList.toggle("on", a.dataset.org === v));
  }
  setOrg(org);
  orgTabs.forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); setOrg(a.dataset.org); }));

  // 수정 모드
  if (editId) {
    document.getElementById("pageTitle").textContent = "글 수정";
    const { data: p } = await sb.from("posts").select("*").eq("id", editId).single();
    if (p) {
      document.getElementById("title").value = p.title;
      setOrg(p.org === "YB" ? "YB" : "OB");
      document.getElementById("category").value = p.category;
      document.getElementById("content").value = p.content;
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    const row = {
      title: document.getElementById("title").value.trim(),
      org: org,
      category: document.getElementById("category").value,
      visibility: "members",
      content: document.getElementById("content").value,
    };
    let res;
    if (editId) {
      res = await sb.from("posts").update({ ...row, updated_at: new Date().toISOString() }).eq("id", editId).select("id").single();
    } else {
      res = await sb.from("posts").insert({ ...row, author_id: user.id, author_name: profile.name || "" }).select("id").single();
    }
    btn.disabled = false;
    if (res.error) {
      msg.className = "msg err"; msg.textContent = "등록 실패: " + res.error.message;
    } else {
      location.href = "post.html?id=" + res.data.id;
    }
  });
}
</script>

</body>
</html>
